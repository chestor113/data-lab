---
- name: Install WireGuard stuff
  ansible.builtin.apt:
    name:
      - wireguard
      - nftables
    state: present
    update_cache: true

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-wireguard.conf
    reload: true


- name: Put nftables config
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

- name: Start nftables on boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
